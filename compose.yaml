networks:
    nginx_proxy:
        # This is a Docker network created by whatever is running the nginx-proxy container.
        external: true

services:
    scorarium-demo:
        image: ghcr.io/notgnoshi/scorarium:latest
        restart: unless-stopped
        user: "${UID:-1000}:${GID:-1000}"
        networks:
            - nginx_proxy
        volumes:
            # The scorarium image is a scratch image, and doesn't have a shell to create and chown
            # this directory itself, so the user must create it themselves.
            - type: bind
              source: ./data
              target: /data
              bind:
                  create_host_path: false
        command: ["serve", "--demo", "--cache-dir", "/data/cache"]
        environment:
            - VIRTUAL_HOST=scorarium.agill.xyz,scorarium.agill.net
            - LETSENCRYPT_HOST=scorarium.agill.xyz,scorarium.agill.net
            - SCORARIUM_CONTACT=${SCORARIUM_CONTACT:-notgnoshi@gmail.com}

    scorarium-prod:
        image: ghcr.io/notgnoshi/scorarium:latest
        restart: unless-stopped
        user: "${UID:-1000}:${GID:-1000}"
        networks:
            - nginx_proxy
        volumes:
            # Share the same cache directory as the demo instance. This doesn't share a database
            # because the demo instance still uses a tempdir for that.
            - type: bind
              source: ./data
              target: /data
              bind:
                  create_host_path: false
        environment:
            - VIRTUAL_HOST=library.agill.xyz,library.agill.net
            - LETSENCRYPT_HOST=library.agill.xyz,library.agill.net
            - SCORARIUM_CONTACT=${SCORARIUM_CONTACT:-notgnoshi@gmail.com}
