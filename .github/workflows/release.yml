name: Release

# This workflow is not ordered after the 'Lint' workflow. And doing so is difficult, because
# workflow_run: only applies on the default branch, and I EXPRESSLY WANT this workflow to run in PRs
# too, because it validates some preconditions for making the release.
#
# So make the assumption that if the PR pipeline passed, and this workflow runs on the default
# branch, it's okay to make a release without waiting for the build and test
on: push
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    IMAGE: ghcr.io/notgnoshi/scorarium

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            version: ${{ steps.metadata.outputs.version }}
            created: ${{ steps.create.outputs.created }}
        steps:
            - uses: actions/checkout@v6

            - name: Extract Release Metadata
              id: metadata
              shell: bash
              run: |
                VERSION="$(.github/parse-manifest-key.sh Cargo.toml version)"
                DESCRIPTION="${{ github.event.repository.description }}"
                echo "VERSION=$VERSION" >> "$GITHUB_ENV"
                echo "DESCRIPTION=$DESCRIPTION" >> "$GITHUB_ENV"
                echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            # Always generate release notes for the current version. If the version from the Cargo
            # manifest isn't found in the CHANGELOG.md, then fail the pipeline (even in PRs)
            - name: Generate Release Notes
              shell: bash
              run: .github/get-release-notes.sh "$VERSION" "$DESCRIPTION" | tee release.md

            - name: Create Release
              id: create
              shell: bash
              if: github.ref_name == github.event.repository.default_branch
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                if gh release view "v$VERSION" &>/dev/null; then
                    echo "Release v$VERSION already exists. Skipping ..."
                else
                    echo "Creating release v$VERSION ..."
                    PRERELEASE_FLAG=""
                    if [[ "$VERSION" == *-rc* ]]; then
                        PRERELEASE_FLAG="--prerelease"
                    fi
                    gh release create "v$VERSION" \
                        --title "v$VERSION" \
                        --notes-file release.md \
                        $PRERELEASE_FLAG
                    echo "created=true" >> "$GITHUB_OUTPUT"
                fi

    # The image is a static musl binary built here on the runner and copied into a scratch base.
    image:
        runs-on: ubuntu-latest
        # Waits on the release job so this job knows whether a release was just created
        needs: release
        permissions:
            contents: write
            packages: write
        env:
            # Build against the checked-in .sqlx/ metadata, not a dev database
            SQLX_OFFLINE: "true"
            VERSION: ${{ needs.release.outputs.version }}
            RELEASE_CREATED: ${{ needs.release.outputs.created }}
        steps:
            - uses: actions/checkout@v6
            - name: Setup Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                toolchain: stable
                targets: x86_64-unknown-linux-musl
            - name: Install musl C compiler
              run: |
                sudo apt-get update
                sudo apt-get install --yes musl-tools
            - name: Setup Rust cache
              uses: swatinem/rust-cache@v2
            - name: Build
              run: cargo build --release --target x86_64-unknown-linux-musl
            - name: Build image
              run: docker build --tag "$IMAGE:latest" .
            - name: Smoke test
              run: docker run --rm "$IMAGE:latest" --version
            - name: Push
              if: github.ref_name == github.event.repository.default_branch
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
                docker push "$IMAGE:latest"
                if [[ "$RELEASE_CREATED" == "true" ]]; then
                    docker tag "$IMAGE:latest" "$IMAGE:v$VERSION"
                    docker push "$IMAGE:v$VERSION"
                    # gh names the asset after the file
                    cp target/x86_64-unknown-linux-musl/release/scorarium scorarium-x86_64-unknown-linux-musl
                    gh release upload "v$VERSION" scorarium-x86_64-unknown-linux-musl
                fi
            # Pushing a new :latest is what untags the previous one, so prune here rather than on a schedule.
            - name: Prune untagged images
              if: github.ref_name == github.event.repository.default_branch
              uses: actions/delete-package-versions@v5
              with:
                package-name: scorarium
                package-type: container
                min-versions-to-keep: 0
                delete-only-untagged-versions: "true"
