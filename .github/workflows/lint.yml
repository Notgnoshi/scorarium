name: Lint
on: push
env:
    CARGO_BUILD_WARNINGS: deny
    CARGO_TERM_COLOR: always
    # Tests should be done against the checkedin .sqlx/ metadata, not a dev database
    SQLX_OFFLINE: "true"
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Setup Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                toolchain: stable
                components: rustfmt
            - name: Run rustfmt
              run: cargo fmt -- --check --config group_imports=StdExternalCrate,imports_granularity=Module

    dprint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Setup dprint
              uses: dprint/check@v2.2

    djlint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Setup djlint
              run: pipx install djlint
            - name: Check HTML template formatting
              run: |
                  djlint --check \
                      --profile django \
                      --indent 4 \
                      --max-line-length 120 \
                      --format-css \
                      --format-js \
                      crates/scorarium/templates/

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Setup Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                toolchain: stable
                components: clippy
            - name: Setup Rust cache
              uses: swatinem/rust-cache@v2
            - name: Build
              run: cargo build --all-targets --all-features
            - name: Clippy
              run: cargo clippy --no-deps --all-targets --all-features
            - name: Setup sqlx-cli
              uses: taiki-e/install-action@v2
              with:
                tool: sqlx-cli
            # 'cargo sqlx prepare' overrides SQLX_OFFLINE, so this checks the .sqlx/ metadata
            # against the database
            - name: Check .sqlx query metadata freshness
              env:
                DATABASE_URL: sqlite://target/dev.db
              run: |
                  sqlx database setup --source crates/scorarium/migrations
                  cargo sqlx prepare --check --workspace -- --all-targets --all-features

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Setup Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                toolchain: stable
                components: llvm-tools-preview
            - name: Setup Rust cache
              uses: swatinem/rust-cache@v2
            - name: Setup nextest
              uses: taiki-e/install-action@v2
              with:
                tool: cargo-nextest,cargo-llvm-cov
            - name: Test
              run: |
                  cargo llvm-cov --no-report nextest --all-features
                  cargo llvm-cov report --cobertura --output-path coverage.xml
                  head coverage.xml
                  RATE="$(grep -o -m 1 -P '(?<=line-rate=").*?(?=")' coverage.xml | head -1)"
                  echo "RATE=$RATE"
                  PERCENT="$(echo "($RATE * 100)/1" | bc)"
                  echo "PERCENT=$PERCENT"
                  echo "COVERAGE_PERCENT=$PERCENT" >> $GITHUB_ENV
            - name: Update coverage badge
              uses: schneegans/dynamic-badges-action@v1.7.0
              if: github.ref_name == github.event.repository.default_branch
              with:
                # https://github.com/Notgnoshi/scorarium/settings/secrets/actions
                # https://github.com/settings/personal-access-tokens
                # https://github.com/marketplace/actions/dynamic-badges
                auth: ${{ secrets.SCORARIUM_COVERAGE_GIST_TOKEN }}
                gistID: 595d549002d10272f601d5eb4e005627
                filename: scorarium-coverage.json
                label: Code Coverage
                message: ${{ env.COVERAGE_PERCENT }}
                valColorRange: ${{ env.COVERAGE_PERCENT }}
                minColorRange: 40
                maxColorRange: 95
