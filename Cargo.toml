[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0-rc0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal crates
scorarium = { path = "crates/scorarium" }

# External crates
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive", "env"] }
color-eyre = "0.6.5"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
