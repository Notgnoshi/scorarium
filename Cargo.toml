[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal crates
scorarium = { path = "crates/scorarium" }
scorarium-archive = { path = "crates/scorarium-archive" }
scorarium-client = { path = "crates/scorarium-client" }
scorarium-tests = { path = "crates/scorarium-tests" }

# External crates
argon2 = "0.6.0"
askama = "0.16.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
axum-test = "21.1.0"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
color-eyre = "0.6.5"
comparable = { version = "0.5.7", features = ["derive"] }
cookie = "0.18.2"
ctor = "1.0.13"
deunicode = "1.6.2"
eyre = "0.6.14"
frizbee = "0.13.0"
getrandom = "0.4.3"
http = "1.5.0"
httpdate = "1.0.3"
isbn = "0.8"
log = "0.4.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] } # rustls allows musl for docker deployment
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_html_form = "0.4.1"
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
