<div class="dropdown">
    <input class="form-control"
           type="search"
           id="{{ name }}"
           name="{{ name }}"
           value="{{ value }}"
           placeholder="{{ placeholder }}"
           autocomplete="off"
           role="combobox"
           aria-autocomplete="list"
           aria-controls="{{ name }}-menu"
           aria-expanded="false"
           data-typeahead="{{ url }}">
    <div class="dropdown-menu w-100" id="{{ name }}-menu" role="listbox" data-bs-popper="static"></div>
</div>
