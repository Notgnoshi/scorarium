<div data-list-input="link">
    <ul class="list-unstyled" data-entries>
        {% for link in links %}
            <li class="d-flex align-items-center gap-2" data-value="{{ link.href }}">
                {{ link.icon }}
                <span class="text-truncate" title="{{ link.href }}">{{ link.href }}</span>
                <button type="button"
                        class="btn btn-sm btn-link"
                        data-remove
                        data-key="{{ link.id }}"
                        title="Remove link">
                    <i class="bi bi-x-lg"></i>
                </button>
            </li>
        {% endfor %}
    </ul>
    <template>
        <li class="d-flex align-items-center gap-2">
            <i class="bi bi-link-45deg" title="New link"></i>
            <span class="text-truncate" data-label></span>
            <input type="hidden" name="add_link">
            <button type="button" class="btn btn-sm btn-link" data-remove title="Remove link">
                <i class="bi bi-x-lg"></i>
            </button>
        </li>
    </template>
    <div class="input-group">
        <input type="url"
               class="form-control"
               placeholder="https://"
               pattern="https?://.+"
               title="An HTTP web address"
               data-add>
        <button type="button" class="btn btn-outline-secondary" data-add-button>Add</button>
    </div>
</div>
