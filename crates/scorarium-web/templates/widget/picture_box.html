<fieldset class="box" data-picture-box data-drop-zone="Drop a picture">
    <legend>{{ legend }}</legend>
    <div class="position-relative d-inline-block" data-picture>{{ picture }}</div>
    <div class="mt-2">{{ input }}</div>
    {% if let Some(remove_url) = remove_url %}
        <form class="mt-2"
              hx-post="{{ remove_url }}"
              hx-target="closest [data-picture-box]"
              hx-swap="outerHTML"
              hx-disable="find button">
            <button class="btn btn-sm btn-outline-danger" type="submit" title="Remove the picture">
                <i class="bi bi-trash"></i> Remove
            </button>
        </form>
    {% endif %}
    <div class="alert alert-danger mt-2 mb-0" data-message role="alert" hidden></div>
</fieldset>
