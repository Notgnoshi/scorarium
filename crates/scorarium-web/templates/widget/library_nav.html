<h1 class="d-flex justify-content-between align-items-center">
    <span>
        {{ name }}
        {% if private %}
            <i class="bi bi-lock-fill" title="Private"></i>
        {% endif %}
    </span>
    {% if logged_in %}
        <a class="btn btn-outline-secondary btn-sm"
           href="/library/{{ id }}/edit"
           title="Edit library"><i class="bi bi-pencil"></i> Edit</a>
    {% endif %}
</h1>
<ul class="nav nav-underline border-bottom mb-3">
    <li class="nav-item">
        <a class="nav-link{% if active == Active::Publications %} active{% endif %}" href="/library/{{ id }}">
            Publications <span class="badge text-bg-secondary">{{ publications }}</span>
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link{% if active == Active::People %} active{% endif %}" href="/library/{{ id }}/people">
            People <span class="badge text-bg-secondary">{{ people }}</span>
        </a>
    </li>
    {% for (role, count) in roles %}
        <li class="nav-item">
            <a class="nav-link{% if self.is_role(role) %} active{% endif %}"
               href="/library/{{ id }}/people/{{ role|urlencode_strict }}">
                {{ crate::page::library::entity::plural_role_label(role) }} <span class="badge text-bg-secondary">{{ count }}</span>
            </a>
        </li>
    {% endfor %}
</ul>
