{% if let Some(state) = state %}
    <span title="Requests to external sources">
        {% match state %}
        {% when EnrichmentState::InProgress %}
        <span class="spinner-border spinner-border-sm" role="status" title="Enrichment in progress"></span>
        {% when EnrichmentState::Failed %}
        <i class="bi bi-exclamation-triangle text-danger" title="Enrichment failed"></i>
        {% when EnrichmentState::Cancelled %}
        <i class="bi bi-stop-circle text-body-secondary" title="Enrichment cancelled"></i>
        {% when EnrichmentState::Completed %}
        <i class="bi bi-check-circle text-success" title="Enrichment finished"></i>
{% endmatch %}
{{ text }}
</span>
{% if let Some(action) = action %}
    <form class="d-inline"
          hx-post="/api/review/{{ entity.kind() }}/{{ entity.get() }}/{{ action.route() }}?{{ query }}"
          hx-target="#review-queue"
          hx-swap="outerHTML">
        <button class="btn btn-sm btn-outline-secondary py-0" type="submit">{{ action.label() }}</button>
    </form>
{% endif %}
{% endif %}
