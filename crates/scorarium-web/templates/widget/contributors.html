<h2>Contributors</h2>
{% if let Some(error) = error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
{% if !contributors.is_empty() %}
    <table class="table">
        <tbody>
            {% for contributor in contributors %}
                <tr>
                    <td>{{ contributor.name }}</td>
                    <td>{{ contributor.role }}</td>
                    <td class="text-end">
                        <form hx-post="{{ api }}/contributor/remove" hx-target="#contributors">
                            <input type="hidden" name="person" value="{{ contributor.person }}">
                            <input type="hidden" name="role" value="{{ contributor.role }}">
                            <button class="btn btn-sm btn-link" title="Remove contributor">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </form>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endif %}
<h3 class="h6">New contributor</h3>
<form class="row g-2" hx-post="{{ api }}/contributor/add" hx-target="#contributors">
    <div class="col position-relative" data-pick-icon>
        {{ self.person() }}
        <i class="bi position-absolute top-50 end-0 translate-middle-y me-3 d-none"></i>
    </div>
    <div class="col">{{ self.role() }}</div>
    <div class="col-auto">
        <button class="btn btn-outline-secondary" title="Add contributor">
            <i class="bi bi-plus-lg"></i> Add
        </button>
    </div>
</form>
