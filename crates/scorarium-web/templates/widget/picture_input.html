<div class="picture-input" data-picture-input data-drop-zone>
    <div class="picture-frame"
         data-picture-frame
         data-drop-frame="Drop a picture"
         {% if src.is_some() %}data-has-picture{% endif %}>
        <img class="picture" {% if let Some(src) = src %}src="{{ src }}"{% endif %} alt="{{ label }}">
        <div class="picture-placeholder">
            {{ icon }}
            <span class="fs-6">{{ label }}</span>
        </div>
        <i class="bi bi-upload picture-hint" title="Browse for a picture"></i>
        <button type="button" class="btn btn-sm btn-outline-secondary" title="Remove the picture" data-file-clear>
            <i class="bi bi-x-lg"></i>
        </button>
    </div>
    <input type="hidden" name="remove_picture" value="1" {% if !remove %}disabled{% endif %}>
    {{ input }}
</div>
