{% macro link(href) %}
    <a class="dropdown-item" role="option" href="{{ href }}">{{ caller() }}</a>
{% endmacro %}

{% macro value(text) %}
    <button type="button" class="dropdown-item" role="option" data-value="{{ text }}">{{ caller() }}</button>
{% endmacro %}

{% macro action(url, name, value) %}
    <form method="post" action="{{ url }}">
        <button class="dropdown-item" role="option" name="{{ name }}" value="{{ value }}">{{ caller() }}</button>
    </form>
{% endmacro %}

{% macro empty() %}
    <span class="dropdown-item-text">No matches</span>
{% endmacro %}
