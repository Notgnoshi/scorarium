{% if thumbnail %}
    <span class="thumbnail d-inline-flex align-items-center justify-content-center flex-shrink-0 border rounded text-body-secondary fs-4">
        {% if let Some(src) = src %}
            <img src="{{ src }}" alt="{{ title }}" loading="lazy">
        {% else %}
            {{ icon }}
        {% endif %}
    </span>
{% else if let Some(src) = src %}
    <a href="{{ src }}" target="_blank" title="Open in a new tab">
        <img class="picture border rounded" src="{{ src }}" alt="{{ title }}" loading="lazy">
    </a>
{% else %}
    <div class="border rounded d-flex flex-column align-items-center justify-content-center text-center text-body-secondary p-2 fs-1"
         style="width: 10rem;
                height: 14rem">
        {{ icon }}
        <span class="fs-6">{{ title }}</span>
    </div>
{% endif %}
