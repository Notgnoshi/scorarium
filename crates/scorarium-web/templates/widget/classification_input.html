<div class="btn-group" role="group" aria-label="Classification">
    <input class="btn-check"
           type="radio"
           name="classification"
           id="classification-music"
           value="music"
           {% if value == Some(Classification::Music) %}checked{% endif %}>
    <label class="btn btn-outline-secondary" for="classification-music">
        {{ crate::icon::Icon::SheetMusic }} Music
    </label>
    <input class="btn-check"
           type="radio"
           name="classification"
           id="classification-prose"
           value="prose"
           {% if value == Some(Classification::Prose) %}checked{% endif %}>
    <label class="btn btn-outline-secondary" for="classification-prose">{{ crate::icon::Icon::Prose }} Prose</label>
</div>
