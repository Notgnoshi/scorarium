<div class="d-flex align-items-start gap-2" id="holding-add">
    <button type="button"
            class="btn btn-link btn-sm holding-add-toggle"
            data-bs-toggle="collapse"
            data-bs-target="#holding-add-form"
            aria-controls="holding-add-form"
            aria-expanded="false">
        <i class="bi bi-plus-lg" title="Add a copy"></i>
        <i class="bi bi-dash-lg" title="Close"></i>
    </button>
    <div class="collapse flex-grow-1" id="holding-add-form">
        <ul class="nav nav-pills mb-2" role="tablist">
            <li class="nav-item" role="presentation">
                <button type="button"
                        class="nav-link active py-1 px-2"
                        role="tab"
                        data-bs-toggle="pill"
                        data-bs-target="#holding-add-physical"
                        aria-selected="true">{{ crate::icon::Icon::PhysicalCopy }} Physical</button>
            </li>
            <li class="nav-item" role="presentation">
                <button type="button"
                        class="nav-link py-1 px-2"
                        role="tab"
                        data-bs-toggle="pill"
                        data-bs-target="#holding-add-digital"
                        aria-selected="false">{{ crate::icon::Icon::DigitalFile }} Digital</button>
            </li>
        </ul>
        <div class="tab-content">
            {{ self.physical() }}
            <div class="tab-pane fade" id="holding-add-digital" role="tabpanel">{{ self.file_input() }}</div>
        </div>
    </div>
</div>
