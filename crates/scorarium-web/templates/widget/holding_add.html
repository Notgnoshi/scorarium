<div class="d-flex align-items-start gap-2" id="holding-add">
    <button type="button"
            class="btn btn-link btn-sm holding-add-toggle"
            data-bs-toggle="collapse"
            data-bs-target="#holding-add-form"
            aria-controls="holding-add-form"
            aria-expanded="false">
        <i class="bi bi-plus-lg" title="Add a copy"></i>
        <i class="bi bi-dash-lg" title="Close"></i>
    </button>
    <div class="collapse flex-grow-1" id="holding-add-form">
        <div class="btn-group mb-2" role="group" aria-label="Kind">
            <input class="btn-check" type="radio" name="holding-add-kind" id="holding-add-kind-physical" checked>
            <label class="btn btn-outline-secondary"
                   for="holding-add-kind-physical">{{ crate::icon::Icon::PhysicalCopy }} Physical</label>
            <input class="btn-check" type="radio" name="holding-add-kind" id="holding-add-kind-digital">
            <label class="btn btn-outline-secondary"
                   for="holding-add-kind-digital">{{ crate::icon::Icon::DigitalFile }} Digital</label>
        </div>
        {{ self.physical() }}
        <div id="holding-add-digital">{{ self.file_input() }}</div>
    </div>
</div>
