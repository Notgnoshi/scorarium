{% extends "base.html" %}
{% block content %}
    <h1>{{ base.title }}</h1>
    {% if changed %}<div class="alert alert-success">Password changed.</div>{% endif %}
    <div class="list-group mb-3">
        <a class="list-group-item list-group-item-action" href="/settings/loans">Loans</a>
        <a class="list-group-item list-group-item-action" href="/settings/audit">Audit log</a>
        <a class="list-group-item list-group-item-action" href="/settings/catalog">Unrecognized catalog numbers</a>
        <a class="list-group-item list-group-item-action" href="/settings/duplicates">Potential duplicates</a>
        {% if password %}<a class="list-group-item list-group-item-action"
                            href="/settings/password">Change password</a>{% endif %}
    </div>
    {% if demo %}
        <form class="mb-3" method="post" action="/settings/demo/reset">
            <button class="btn btn-outline-danger" type="submit">Reset demo data</button>
        </form>
    {% endif %}
    <form method="post" action="/logout">
        <button class="btn btn-outline-secondary" type="submit">Log out</button>
    </form>
{% endblock %}
