{% extends "base.html" %}
{% block content %}
    <h1>{{ base.title }}</h1>
    {% if let Some(error) = error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post" action="/settings/password">
        <div class="mb-3">
            <label class="form-label" for="new">New password</label>
            <input class="form-control" type="password" id="new" name="new" autocomplete="new-password" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="confirm">Confirm</label>
            <input class="form-control"
                   type="password"
                   id="confirm"
                   name="confirm"
                   autocomplete="new-password"
                   required>
        </div>
        <button class="btn btn-primary" type="submit">Change password</button>
    </form>
{% endblock %}
