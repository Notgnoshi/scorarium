{% extends "base.html" %}
{% block content %}
    <h1 class="d-flex justify-content-between align-items-center">
        <span>
            {{ base.title }}
            {% if draft %}<span class="badge text-bg-secondary">Draft</span>{% endif %}
        </span>
    </h1>
    {% if let Some(error) = error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post" action="/library/{{ library }}/person/{{ id }}/edit">
        <div class="row mb-3">
            <label class="col-sm-2 col-form-label" for="name">Name</label>
            <div class="col-sm-10">
                <input class="form-control" type="text" id="name" name="name" value="{{ name }}" required>
            </div>
        </div>
        <div class="row mb-3">
            <label class="col-sm-2 col-form-label" for="sort_name">Sort name</label>
            <div class="col-sm-10">
                <input class="form-control" type="text" id="sort_name" name="sort_name" value="{{ sort_name }}">
                <div class="form-text">Leave blank to sort by Last, First</div>
            </div>
        </div>
        <div class="row mb-3">
            <span class="col-sm-2 col-form-label">Profile image</span>
            <div class="col-sm-10">
                <div class="border rounded d-flex flex-column align-items-center justify-content-center text-center text-body-secondary p-2"
                     style="width: 10rem;
                            height: 14rem">
                    <i class="bi bi-person fs-1" title="Person"></i>
                    <span>{{ base.title }}</span>
                </div>
            </div>
        </div>
        <button class="btn btn-primary" type="submit" title="Save changes">
            <i class="bi bi-floppy"></i> Save
        </button>
        <a class="btn btn-outline-secondary"
           href="/library/{{ library }}/person/{{ id }}"
           title="Discard changes">
            <i class="bi bi-x-lg"></i> Cancel
        </a>
    </form>
{% endblock %}
