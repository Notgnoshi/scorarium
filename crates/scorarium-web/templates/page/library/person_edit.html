{% extends "base.html" %}
{% block content %}
    {{ heading }}
    {{ refusals }}
    <form id="edit"
          method="post"
          action="/library/{{ library }}/person/{{ id }}/edit{% if let Some(back) = back %}?back={{ back|urlencode }}{% endif %}">
        <fieldset class="box">
            <legend>Details</legend>
            <div class="row">
                <div class="col-12 col-md-auto mb-3">{{ picture }}</div>
                <div class="col-12 col-md">
                    <div class="row mb-3">
                        <label class="col-sm-2 col-form-label" for="name">Name</label>
                        <div class="col-sm-10">
                            <input class="form-control{% if refusals.of("name").is_some() %} is-invalid{% endif %}"
                                   type="text"
                                   id="name"
                                   name="name"
                                   value="{{ name }}"
                                   required
                                   {% if refusals.first() == Some("name") %}autofocus{% endif %}>
                            {% if let Some(reason) = refusals.of("name") %}<div class="invalid-feedback">{{ reason }}</div>{% endif %}
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label class="col-sm-2 col-form-label" for="sort_name">Sort name</label>
                        <div class="col-sm-10">
                            <input class="form-control"
                                   type="text"
                                   id="sort_name"
                                   name="sort_name"
                                   value="{{ sort_name }}">
                            <div class="form-text">Leave blank to sort by Last, First</div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <span class="col-sm-2 col-form-label">Links</span>
                        <div class="col-sm-10">{{ links }}</div>
                    </div>
                </div>
            </div>
        </fieldset>
    </form>
{% endblock %}
