{% extends "base.html" %}
{% block content %}
    <h1>Log in</h1>
    {% if let Some(error) = error %}<p>{{ error }}</p>{% endif %}
    <form method="post" action="/login">
        <label>
            Password
            <input type="password" name="password" required />
        </label>
        <button>Log in</button>
    </form>
{% endblock %}
