{% macro indicator(recognized) %}
    <span data-catalog-indicator
          data-bs-toggle="tooltip"
          title="{% if recognized %}Recognized catalog number scheme{% else %}Unrecognized catalog number scheme{% endif %}">
        <i class="bi {% if recognized %}bi-check-circle{% else %}bi-question-circle text-body-secondary{% endif %}"
           aria-hidden="true"></i>
    </span>
{% endmacro %}
{% macro number(catalog_number) %}
    {{ catalog_number.as_str() }}
    {% call indicator(catalog_number.is_recognized()) %}
    {% endcall %}
{% endmacro %}
{% macro script() %}
    <script>
        // Glue between the generic suggestion component and the special cases for catalog numbers.

        // The person glue's link needs a match; a work pick has only the id, and shows no credit
        function creditPerson(input, id) {
            if (id === null) return;
            referenceOf(input).value = id;
            showPerson(input, "linked", "");
        }

        function composerOf(input) {
            const row = input.closest("[data-row]");
            const own = row?.querySelector("[name=work_contributor_name]");
            if (own) return own.value.trim();
            const role = [...input.form.querySelectorAll("[name=contributor_role]")]
                .find((role) => role.value.trim().toLowerCase() === "composer");
            const name = role?.closest("[data-row]").querySelector("[name=contributor_name]");
            return name ? name.value.trim() : "";
        }

        function showRecognized(input, recognized) {
            const span = input.closest(".input-group")?.querySelector("[data-catalog-indicator]");
            if (!span) return;
            const title = recognized ? "Recognized catalog number scheme" : "Unrecognized catalog number scheme";
            // A tooltip that has already been shown reads the title it stashed away
            span.setAttribute("title", title);
            span.setAttribute("data-bs-original-title", title);
            bootstrap.Tooltip.getInstance(span)?.setContent({
                ".tooltip-inner": title
            });
            span.querySelector("i").className = recognized ?
                "bi bi-check-circle" :
                "bi bi-question-circle text-body-secondary";
        }

        function creditContributor(input, name, role, id) {
            const row = input.closest("[data-row]");
            const own = row?.querySelector("[name=work_contributor_name]");
            if (own) {
                if (own.value.trim()) return;
                own.value = name;
                const field = row.querySelector("[name=work_contributor_role]");
                if (field && !field.value.trim()) field.value = role;
                creditPerson(own, id);
                return;
            }
            const credits = input.form.querySelector("[data-contributors]");
            if (!credits) return;
            const named = [...credits.querySelectorAll("[name=contributor_name]")]
                .some((field) => field.value.trim());
            if (named) return;
            const empty = [...credits.querySelectorAll("[data-row]")]
                .find((row) => !row.querySelector("[name=contributor_name]").value.trim());
            const target = empty ?? (credits.querySelector("[data-rows-add]").click(),
                credits.querySelector("[data-rows-list] [data-row]:last-child"));
            target.querySelector("[name=contributor_name]").value = name;
            target.querySelector("[name=contributor_role]").value = role;
            creditPerson(target.querySelector("[name=contributor_name]"), id);
        }

        function takeTitle(input, title) {
            const row = input.closest("[data-row]");
            // The publication form's row titles a work of its own; the work form has just one
            const field = row?.querySelector("[name=work_title]") ??
                input.form.querySelector("[name=title]");
            if (field) field.value = title;
        }

        function numberInputOf(input) {
            const row = input.closest("[data-row]");
            return row?.querySelector("[name=work_catalog_number]") ??
                input.form.querySelector("[name=catalog_number]");
        }

        document.addEventListener("suggest:query", (e) => {
            if (e.target.matches('[data-suggest="work-number"]')) {
                e.detail.params.set("composer", composerOf(e.target));
            }
        });

        document.addEventListener("suggest:matches", (e) => {
            if (e.target.matches('[data-suggest="work-number"]') && e.target.value.trim()) {
                showRecognized(e.target, e.detail.recognized);
            }
        });

        document.addEventListener("suggest:pick", (e) => {
            const match = e.detail;
            if (!e.target.matches("[data-suggest]") || match.kind !== "work") return;
            takeTitle(e.target, match.title);
            if (match.contributor) creditContributor(e.target, match.contributor, match.role, match.contributor_id);
            const number = numberInputOf(e.target);
            if (number && !number.value.trim() && match.numbers.length) number.value = match.numbers[0];
            if (number && match.recognized !== undefined) showRecognized(number, match.recognized);
        });
    </script>
{% endmacro %}
