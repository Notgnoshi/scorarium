{% macro input(value, error) %}
    <div class="mb-3 position-relative" data-tags>
        <label class="form-label" for="tags">Tags</label>
        <input class="form-control{% if error.is_some() %} is-invalid{% endif %}"
               id="tags"
               name="tags"
               placeholder="christmas piano-duet want-to-learn"
               value="{{ value }}" />
        {% if let Some(error) = error %}<div class="invalid-feedback">{{ error }}</div>{% endif %}
    </div>
{% endmacro %}
{% macro badges(library_id, tags) %}
    {% for t in tags.iter() %}<a class="badge text-bg-secondary me-1"
   href="/library/{{ library_id }}/tags/{{ t }}">{{ t }}</a>{% endfor %}
{% endmacro %}
{% macro style() %}
    <style>
        .tag-box {
            cursor: text;
            height: auto;
        }

        .tag-entry {
            background: none;
            border: 0;
            flex: 1 1 6rem;
            min-width: 6rem;
            outline: none;
            padding: 0;
        }

        .tag-box:has(.tag-entry:focus) {
            border-color: var(--bs-focus-ring-color);
            box-shadow: var(--bs-focus-ring-x, 0) var(--bs-focus-ring-y, 0) var(--bs-focus-ring-blur, 0) var(--bs-focus-ring-width) var(--bs-focus-ring-color);
        }

        .tag-box:has(.tag-entry.is-invalid) {
            border-color: var(--bs-form-invalid-border-color);
        }

        .tag-remove {
            background: none;
            border: 0;
            color: inherit;
            font-size: 0.75em;
            line-height: 1;
            padding: 0;
        }
    </style>
{% endmacro %}
{% macro script() %}
    <script>
        // The chip widget over the tags field

        const SLUG = /^[a-z0-9_-]+$/;

        function field(box) {
            return box.querySelector("input[name=tags]");
        }

        function entry(box) {
            return box.querySelector(".tag-entry");
        }

        function tagsOf(box) {
            return field(box).value.split(/\s+/).filter(Boolean);
        }

        function render(box, tags) {
            field(box).value = tags.join(" ");
            for (const chip of box.querySelectorAll(".tag-chip")) chip.remove();
            const entryBox = entry(box);
            for (const tag of tags) {
                const chip = document.createElement("span");
                chip.className = "tag-chip badge text-bg-secondary d-inline-flex align-items-center gap-1";
                chip.append(tag);
                const remove = document.createElement("button");
                remove.type = "button";
                remove.className = "tag-remove";
                remove.dataset.tagsRemove = tag;
                remove.setAttribute("aria-label", `Remove ${tag}`);
                remove.innerHTML = '<i class="bi bi-x-lg" aria-hidden="true"></i>';
                chip.appendChild(remove);
                entryBox.before(chip);
            }
        }

        // Enter, a space, focus leaving the box and the form submitting all commit what is typed.
        function commit(box) {
            const input = entry(box);
            const typed = input.value.trim().toLowerCase();
            input.classList.remove("is-invalid");
            if (!typed) {
                input.value = "";
                return true;
            }
            if (!SLUG.test(typed)) {
                input.classList.add("is-invalid");
                return false;
            }
            const tags = tagsOf(box);
            if (!tags.includes(typed)) render(box, [...tags, typed]);
            input.value = "";
            return true;
        }

        for (const box of document.querySelectorAll("[data-tags]")) {
            const input = field(box);
            input.hidden = true;
            const shell = document.createElement("div");
            shell.className = "tag-box form-control d-flex flex-wrap align-items-center gap-1";
            const typing = document.createElement("input");
            typing.type = "text";
            typing.className = "tag-entry";
            typing.autocomplete = "off";
            typing.dataset.suggest = "tag";
            typing.setAttribute("aria-label", "Add a tag");
            shell.appendChild(typing);
            input.after(shell);
            render(box, tagsOf(box));
        }

        // A tag already carried is not worth offering again
        document.addEventListener("suggest:query", (e) => {
            if (e.target.matches(".tag-entry")) {
                e.detail.params.set("exclude", tagsOf(e.target.closest("[data-tags]")).join(","));
            }
        });

        document.addEventListener("suggest:pick", (e) => {
            if (e.target.matches(".tag-entry")) commit(e.target.closest("[data-tags]"));
        });

        document.addEventListener("keydown", (e) => {
            if (!e.target.matches(".tag-entry")) return;
            const box = e.target.closest("[data-tags]");
            // A pick by Enter has already committed the tag it chose
            if (e.defaultPrevented) return;
            if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                commit(box);
            } else if (e.key === "Backspace" && !e.target.value) {
                render(box, tagsOf(box).slice(0, -1));
            }
        });

        document.addEventListener("focusout", (e) => {
            if (e.target.matches(".tag-entry")) commit(e.target.closest("[data-tags]"));
        });

        document.addEventListener("click", (e) => {
            const remove = e.target.closest("[data-tags-remove]");
            if (remove) {
                const box = remove.closest("[data-tags]");
                const dropped = remove.dataset.tagsRemove;
                render(box, tagsOf(box).filter((tag) => tag !== dropped));
                return;
            }
            const box = e.target.closest("[data-tags] label, [data-tags] .tag-box");
            if (box) entry(box.closest("[data-tags]")).focus();
        });

        document.addEventListener("submit", (e) => {
            for (const box of e.target.querySelectorAll("[data-tags]")) {
                if (!commit(box)) e.preventDefault();
            }
        });
    </script>
{% endmacro %}
