{% extends "base.html" %}
{% block content %}
    <h1>{{ base.title }}</h1>
    <dl class="row">
        <dt class="col-sm-3">Started</dt>
        <dd class="col-sm-9">
            {{ age }}
        </dd>
    </dl>
    <form method="post"
          action="/library/{{ library.id }}/import/{{ import.id }}/save">
        {% include "publication_fields.html" %}
        <div class="d-flex gap-2">
            <button class="btn btn-primary">Save draft</button>
            <a class="btn btn-outline-secondary"
               href="/library/{{ library.id }}/import/{{ import.id }}">Discard edits</a>
            <button type="button"
                    class="btn btn-outline-danger"
                    data-bs-toggle="modal"
                    data-bs-target="#delete-draft">Delete draft</button>
            <button class="btn btn-success"
                    formaction="/library/{{ library.id }}/import/{{ import.id }}/submit">Submit draft</button>
        </div>
    </form>
    <div class="modal fade"
         id="delete-draft"
         tabindex="-1"
         aria-labelledby="delete-draft-title"
         aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content"
                  method="post"
                  action="/library/{{ library.id }}/import/{{ import.id }}/delete">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="delete-draft-title">Delete draft</h1>
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"></button>
                </div>
                <div class="modal-body">Delete this import? Nothing has been added to the library yet.</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
