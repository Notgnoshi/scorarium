{% extends "base.html" %}
{% block content %}
    <h1>{{ base.title }}</h1>
    <dl class="row">
        <dt class="col-sm-3">Copy</dt>
        <dd class="col-sm-9">
            <span class="badge text-bg-secondary">{{ import.kind.as_str() }}</span>
            {% if let Some(location) = import.location %}{{ location }}{% endif %}
        </dd>
        <dt class="col-sm-3">Started</dt>
        <dd class="col-sm-9">
            {{ age }}
        </dd>
    </dl>
    <form method="post"
          action="/library/{{ library.id }}/import/{{ import.id }}/save">
        <div class="mb-3">
            <label class="form-label" for="title">Title</label>
            <input class="form-control"
                   id="title"
                   name="title"
                   value="{{ draft.title }}" />
        </div>
        <div class="mb-3">
            <label class="form-label" for="publisher">Publisher</label>
            <input class="form-control"
                   id="publisher"
                   name="publisher"
                   value="{{ draft.publisher }}" />
        </div>
        <div class="mb-3">
            <label class="form-label" for="year">Year</label>
            <input class="form-control"
                   id="year"
                   name="year"
                   inputmode="numeric"
                   value="{{ draft.year }}" />
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary">Save draft</button>
            <button type="reset" class="btn btn-outline-secondary">Discard edits</button>
            <button type="button"
                    class="btn btn-outline-danger"
                    data-bs-toggle="modal"
                    data-bs-target="#delete-draft">Delete draft</button>
            <button class="btn btn-success" disabled>Submit draft</button>
        </div>
    </form>
    <div class="modal fade"
         id="delete-draft"
         tabindex="-1"
         aria-labelledby="delete-draft-title"
         aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content"
                  method="post"
                  action="/library/{{ library.id }}/import/{{ import.id }}/delete">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="delete-draft-title">Delete draft</h1>
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"></button>
                </div>
                <div class="modal-body">Delete this import? Nothing has been added to the library yet.</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
